name: acceptance

# Pull requests run the acceptance and web image lanes on the GitHub
# organization copy (.github/workflows/mirror-ci.yml). Gitea keeps the main
# and manual runs as a backup check; GitHub Actions deploys main
# (.github/workflows/deploy.yml).
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    # Cold Turbopack + TypeScript builds exceed the runner default of 4 GiB.
    container:
      image: docker.gitea.com/runner-images@sha256:58ea92624c7c09582e05594d95488331045053d3a3f34cf09649f2a32313a614
      options: --memory=6g --memory-swap=6g --cpus=2
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      ACCEPTANCE_TESTS: "1"
      # Date columns come back from pg as local-midnight Dates; pin the lane's timezone so subject hashes are reproducible.
      TZ: UTC
      NODE_ENV: test
      ACCEPTANCE_MAP_ARTIFACT_ROOT: /tmp/dsa-seats-task13-acceptance/task10-maps
      E2E_MAP_PROFILE_PATH: /seats/seat_0
      POSTGRES_PORT: "0"
      POSTGRES_FSYNC: "off"
      POSTGRES_SYNCHRONOUS_COMMIT: "off"
      POSTGRES_FULL_PAGE_WRITES: "off"
    steps:
      - name: Ensure Git LFS is available
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            apt-get update
            apt-get install --yes --no-install-recommends git-lfs
          fi
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch pinned LFS sources without conflicting headers
        env:
          CI_LFS_TOKEN: ${{ github.token }}
        run: bash scripts/ci-lfs-checkout.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install source-evidence tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends poppler-utils
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure isolated Compose namespace
        run: |
          : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY must be set}"
          : "${GITHUB_RUN_ID:?GITHUB_RUN_ID must be set}"
          : "${GITHUB_RUN_ATTEMPT:?GITHUB_RUN_ATTEMPT must be set}"
          repository_hash="$(printf '%s' "$GITHUB_REPOSITORY" | sha256sum)"
          repository_key="${repository_hash%% *}"
          repository_key="${repository_key:0:12}"
          echo "ACCEPTANCE_REPOSITORY_KEY=$repository_key" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=dsa_seats_acceptance_${repository_key}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "POSTGRES_NETWORK_ALIAS=acceptance-postgres-${repository_key}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Create disposable tmpfs database volume
        run: |
          database_volume="${COMPOSE_PROJECT_NAME}_postgres_data"
          echo "ACCEPTANCE_POSTGRES_VOLUME=$database_volume" >> "$GITHUB_ENV"
          docker volume create \
            --driver local \
            --opt type=tmpfs \
            --opt device=tmpfs \
            --opt o=size=4g \
            --label "com.docker.compose.project=${COMPOSE_PROJECT_NAME}" \
            --label com.docker.compose.volume=postgres_data \
            "$database_volume"
      - run: docker compose up -d --wait
      - name: Configure isolated database transport
        run: |
          if docker inspect "$(hostname)" >/dev/null 2>&1; then
            : "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must be set}"
            : "${POSTGRES_NETWORK_ALIAS:?POSTGRES_NETWORK_ALIAS must be set}"
            compose_network="${COMPOSE_PROJECT_NAME}_default"
            database_host="$POSTGRES_NETWORK_ALIAS"
            database_port=5432
            echo "ACCEPTANCE_JOB_CONTAINER=1" >> "$GITHUB_ENV"
            echo "ACCEPTANCE_DATABASE_HOST=$database_host" >> "$GITHUB_ENV"
            echo "ACCEPTANCE_COMPOSE_NETWORK=$compose_network" >> "$GITHUB_ENV"
            docker network connect "$compose_network" "$(hostname)"
          else
            database_host=127.0.0.1
            database_port="$(docker compose port postgres 5432)"
            database_port="${database_port##*:}"
            echo "ACCEPTANCE_JOB_CONTAINER=0" >> "$GITHUB_ENV"
          fi
          echo "DATABASE_URL=postgresql://dsa_seats:dsa_seats@${database_host}:${database_port}/dsa_seats_acceptance_integration_test" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql://dsa_seats:dsa_seats@${database_host}:${database_port}/dsa_seats_acceptance_integration_test" >> "$GITHUB_ENV"
          echo "QUERY_DATABASE_URL=postgresql://dsa_seats:dsa_seats@${database_host}:${database_port}/dsa_seats_acceptance_query_test" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=postgresql://dsa_seats:dsa_seats@${database_host}:${database_port}/dsa_seats_acceptance_browser_test" >> "$GITHUB_ENV"
          echo "WEB_DATABASE_URL=postgresql://acceptance_web:acceptance_web@${database_host}:${database_port}/dsa_seats_acceptance_browser_test" >> "$GITHUB_ENV"
      - run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U dsa_seats -d postgres -c "CREATE DATABASE dsa_seats_acceptance_integration_test OWNER dsa_seats;" -c "CREATE DATABASE dsa_seats_acceptance_query_test OWNER dsa_seats;" -c "CREATE DATABASE dsa_seats_acceptance_browser_test OWNER dsa_seats;"
      - name: Verify database transport
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          client.connect()
            .then(() => client.query('SELECT 1'))
            .then(() => client.end())
            .catch((error) => {
              console.error(error);
              process.exitCode = 1;
            });
          NODE
      - run: npm run db:migrate
      - run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U dsa_seats -d postgres -c "CREATE ROLE acceptance_web LOGIN PASSWORD 'acceptance_web' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; GRANT dsa_seats_web TO acceptance_web;"
      - run: npm run test:acceptance
        env:
          # Inherited by the aggregate production build and its workers.
          NODE_OPTIONS: --max-old-space-size=2048
      - name: Retain browser failure evidence
        if: failure()
        uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
        with:
          name: acceptance-browser-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: |
          if [ "${ACCEPTANCE_JOB_CONTAINER:-0}" = 1 ]; then
            docker network disconnect "${ACCEPTANCE_COMPOSE_NETWORK}" "$(hostname)" || true
          fi
          docker compose down --volumes --remove-orphans || true
          mapfile -t project_containers < <(docker ps -aq --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}")
          if [ "${#project_containers[@]}" -gt 0 ]; then
            docker rm -f "${project_containers[@]}" || true
          fi
          docker network rm "${COMPOSE_PROJECT_NAME}_default" 2>/dev/null || true
          docker volume rm -f "${ACCEPTANCE_POSTGRES_VOLUME}" 2>/dev/null || true

  web_image:
    name: Web image
    needs: acceptance
    runs-on: ubuntu-latest
    container:
      image: docker.gitea.com/runner-images@sha256:58ea92624c7c09582e05594d95488331045053d3a3f34cf09649f2a32313a614
      options: --memory=6g --memory-swap=6g --cpus=2
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - name: Ensure Git LFS is available
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            apt-get update
            apt-get install --yes --no-install-recommends git-lfs
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: false
      - name: Verify LFS authentication and native backup guards
        run: |
          python3 scripts/test-ci-lfs-checkout.py
          python3 deploy/tests/test_backup_source.py
          python3 scripts/test-ci-source-archive.py
      - name: Fetch pinned LFS sources without conflicting headers
        env:
          CI_LFS_TOKEN: ${{ github.token }}
        run: bash scripts/ci-lfs-checkout.sh
      - name: Build and qualify the accepted web image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          image="fleet-deploy/left-field/app:$DEPLOY_REVISION"
          source_sha=$(python3 scripts/ci-source-archive.py)
          [[ "$source_sha" =~ ^[0-9a-f]{64}$ ]]
          docker build -f deploy/nuc/Dockerfile \
            --build-arg "VCS_REF=$DEPLOY_REVISION" \
            --build-arg "SOURCE_TREE_SHA256=$source_sha" \
            --build-arg "BUILD_DATE=$(git show -s --format=%cI "$DEPLOY_REVISION")" \
            --label "org.opencontainers.image.revision=$DEPLOY_REVISION" \
            --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/left-field" \
            -t "$image" .
          python3 scripts/check-ci-image.py "$image" "$DEPLOY_REVISION"
