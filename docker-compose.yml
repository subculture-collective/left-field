# Local development only; do not expose this database from a deployment host.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: dsa_seats
      POSTGRES_USER: dsa_seats
      POSTGRES_PASSWORD: dsa_seats
    command:
      - postgres
      - -c
      - fsync=${POSTGRES_FSYNC:-on}
      - -c
      - synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-on}
      - -c
      - full_page_writes=${POSTGRES_FULL_PAGE_WRITES:-on}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - ${POSTGRES_NETWORK_ALIAS:-postgres}
    healthcheck:
      # The image's temporary initialization server can satisfy pg_isready.
      # PID 1 becomes postgres only after the final server replaces entrypoint.
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U dsa_seats -d dsa_seats"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
