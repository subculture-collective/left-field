# Local development only; do not expose this database from a deployment host.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: dsa_seats
      POSTGRES_USER: dsa_seats
      POSTGRES_PASSWORD: dsa_seats
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsa_seats -d dsa_seats"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    image: node:22
    working_dir: /workspace
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://dsa_seats:dsa_seats@postgres:5432/dsa_seats_acceptance_integration_test
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
