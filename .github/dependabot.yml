# Weekly dependency updates. Green pull requests in this repository merge
# themselves and deploy, so every ecosystem ignores major versions, groups
# minor and patch updates into one pull request and opens at most two.
#
# The Node image in deploy/nuc is not listed: its version is repeated in
# Dockerfile, Dockerfile.node-security (NODE_VERSION and the version check)
# and node-security.md, and Dependabot would change only the FROM lines.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned to exact versions in package.json. They decide rendered pages,
      # map artifacts, archive bytes or the S3 transport, so update them by
      # hand with the acceptance evidence in view.
      - dependency-name: next
      - dependency-name: eslint-config-next
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: sharp
      - dependency-name: fflate
      - dependency-name: mapshaper
      - dependency-name: "@smithy/node-http-handler"
      # A newer AWS SDK installs a second @smithy/node-http-handler beside
      # the pinned one.
      - dependency-name: "@aws-sdk/*"
      # Styles change rendered output.
      - dependency-name: tailwindcss
      - dependency-name: "@tailwindcss/postcss"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
