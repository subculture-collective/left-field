name: static

# Database-free gate: typecheck, lint, source-lock verification, the fast unit
# lanes, and the production build. This is the check that must be green on
# every pull request; the acceptance job needs Postgres and Chromium and runs
# beside it.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Git LFS is available
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            apt-get update
            apt-get install --yes --no-install-recommends git-lfs
          fi
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run data:verify
      - run: npm run test:fast
      - run: npm run build
