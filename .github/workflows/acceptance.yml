name: acceptance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      ACCEPTANCE_TESTS: "1"
      NODE_ENV: test
      ACCEPTANCE_MAP_ARTIFACT_ROOT: /tmp/dsa-seats-task13-acceptance/task10-maps
      E2E_MAP_PROFILE_PATH: /seats/seat_0
      COMPOSE_PROJECT_NAME: dsa_seats_acceptance_${{ github.run_id }}_${{ github.run_attempt }}
      POSTGRES_PORT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --wait
      - name: Configure isolated database transport
        run: |
          if docker inspect "$(hostname)" >/dev/null 2>&1; then
            docker network connect "${COMPOSE_PROJECT_NAME}_default" "$(hostname)"
            database_host=postgres
            database_port=5432
            echo "ACCEPTANCE_JOB_CONTAINER=1" >> "$GITHUB_ENV"
          else
            database_host=127.0.0.1
            database_port="$(docker compose port postgres 5432)"
            database_port="${database_port##*:}"
            echo "ACCEPTANCE_JOB_CONTAINER=0" >> "$GITHUB_ENV"
          fi
          echo "DATABASE_URL=postgresql://dsa_seats:dsa_seats@${database_host}:${database_port}/dsa_seats_acceptance_integration_test" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql://dsa_seats:dsa_seats@${database_host}:${database_port}/dsa_seats_acceptance_integration_test" >> "$GITHUB_ENV"
          echo "QUERY_DATABASE_URL=postgresql://dsa_seats:dsa_seats@${database_host}:${database_port}/dsa_seats_acceptance_query_test" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=postgresql://dsa_seats:dsa_seats@${database_host}:${database_port}/dsa_seats_acceptance_browser_test" >> "$GITHUB_ENV"
          echo "WEB_DATABASE_URL=postgresql://acceptance_web:acceptance_web@${database_host}:${database_port}/dsa_seats_acceptance_browser_test" >> "$GITHUB_ENV"
      - run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U dsa_seats -d postgres -c "CREATE DATABASE dsa_seats_acceptance_integration_test OWNER dsa_seats;" -c "CREATE DATABASE dsa_seats_acceptance_query_test OWNER dsa_seats;" -c "CREATE DATABASE dsa_seats_acceptance_browser_test OWNER dsa_seats;"
      - run: npm run db:migrate
      - run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U dsa_seats -d postgres -c "CREATE ROLE acceptance_web LOGIN PASSWORD 'acceptance_web' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; GRANT dsa_seats_web TO acceptance_web;"
      - run: npm run test:acceptance
      - if: always()
        run: |
          if [ "${ACCEPTANCE_JOB_CONTAINER:-0}" = 1 ]; then
            docker network disconnect "${COMPOSE_PROJECT_NAME}_default" "$(hostname)" || true
          fi
          docker compose down --volumes --remove-orphans
