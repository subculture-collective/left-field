name: acceptance

on:
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      ACCEPTANCE_TESTS: "1"
      NODE_ENV: test
      DATABASE_URL: postgresql://dsa_seats:dsa_seats@127.0.0.1:5432/dsa_seats_acceptance_integration_test
      TEST_DATABASE_URL: postgresql://dsa_seats:dsa_seats@127.0.0.1:5432/dsa_seats_acceptance_integration_test
      QUERY_DATABASE_URL: postgresql://dsa_seats:dsa_seats@127.0.0.1:5432/dsa_seats_acceptance_query_test
      E2E_DATABASE_URL: postgresql://dsa_seats:dsa_seats@127.0.0.1:5432/dsa_seats_acceptance_browser_test
      WEB_DATABASE_URL: postgresql://acceptance_web:acceptance_web@127.0.0.1:5432/dsa_seats_acceptance_browser_test
      ACCEPTANCE_MAP_ARTIFACT_ROOT: /tmp/dsa-seats-task13-acceptance/task10-maps
      E2E_MAP_PROFILE_PATH: /seats/seat_0
      COMPOSE_PROJECT_NAME: dsa_seats_acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --wait
      - run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U dsa_seats -d postgres -c "CREATE DATABASE dsa_seats_acceptance_integration_test OWNER dsa_seats;" -c "CREATE DATABASE dsa_seats_acceptance_query_test OWNER dsa_seats;" -c "CREATE DATABASE dsa_seats_acceptance_browser_test OWNER dsa_seats;"
      - run: npm run db:migrate
      - run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U dsa_seats -d postgres -c "CREATE ROLE acceptance_web LOGIN PASSWORD 'acceptance_web' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; GRANT dsa_seats_web TO acceptance_web;"
      - run: npm run test:acceptance
      - if: always()
        run: docker compose down -v
